<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Outreach Assistant</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      color: #1c1e21;
      background: #fff;
    }

    /* Header */
    .header {
      background: #0a66c2;
      color: #fff;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .header-icon  { font-size: 20px; line-height: 1; }
    .header-title { font-size: 15px; font-weight: 700; }
    .header-ver   { font-size: 10px; opacity: 0.7; margin-left: auto; }

    /* Body */
    .body { padding: 16px; display: flex; flex-direction: column; gap: 14px; }

    /* Status pill */
    .status {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 11px 13px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 500;
    }
    .status-on  { background: #dcfce7; color: #15803d; }
    .status-off { background: #f5f5f5; color: #6b7280; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot-green { background: #22c55e; }
    .dot-gray  { background: #9ca3af; }

    /* Info box */
    .info-box {
      background: #f0f4fa;
      border-radius: 8px;
      padding: 11px 13px;
      font-size: 12px;
      color: #4b5563;
      line-height: 1.5;
      display: none;
    }
    .info-box .job-title  { font-weight: 700; color: #1c1e21; margin-bottom: 2px; }
    .info-box .job-company{ color: #0a66c2; }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }
    .btn-primary { background: #0a66c2; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #004182; }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }

    /* Divider */
    .divider {
      height: 1px; background: #f0f2f5; margin: 0 -16px;
    }

    /* Footer */
    .footer {
      text-align: center;
      font-size: 11px;
      color: #9ca3af;
      padding: 10px 16px;
    }
    .footer a { color: #0a66c2; text-decoration: none; }
  </style>
</head>
<body>

  <div class="header">
    <span class="header-icon">✉</span>
    <span class="header-title">AI Outreach</span>
    <span class="header-ver">v1.0</span>
  </div>

  <div class="body">
    <!-- Status indicator -->
    <div class="status status-off" id="status">
      <span class="dot dot-gray" id="status-dot"></span>
      <span id="status-text">Checking page…</span>
    </div>

    <!-- Quick job info (shown when on a job page) -->
    <div class="info-box" id="info-box">
      <div class="job-title"  id="info-title">—</div>
      <div class="job-company" id="info-company">—</div>
    </div>

    <!-- Primary action -->
    <button class="btn btn-primary" id="open-btn" disabled>
      Open Outreach Panel
    </button>
  </div>

  <div class="divider"></div>
  <div class="footer">Works on <strong>LinkedIn</strong> job pages</div>

  <script src="popup.js"></script>
</body>
</html>
